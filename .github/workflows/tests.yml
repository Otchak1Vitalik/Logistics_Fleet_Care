# Автоматична перевірка при кожному push і pull request:
# тести бекенду (pytest + MongoDB) і збірка фронтенду.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: Krutii_Trans/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Krutii_Trans/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017/krutii_test
        run: python -m pytest -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Krutii_Trans/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        working-directory: Krutii_Trans
        run: docker compose build
